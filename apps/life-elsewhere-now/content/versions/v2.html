<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>V2 · 暖白杂志</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,-apple-system,sans-serif;background:#f6f1e7;color:#2c2620;min-height:100vh}
  .bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#2c2620;color:#f6f1e7;font-size:.72rem}
  .bar a{color:#e8c56a;text-decoration:none}
  .top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e0d7c6;margin-top:40px}
  .mark{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:600;letter-spacing:.24em}
  .mark i{width:8px;height:8px;border-radius:50%;background:#a3512f}
  .nav{display:flex;gap:26px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#6b6156}
  .nav .on{color:#2c2620}
  .nav .on:after{content:"";display:block;height:2px;margin-top:5px;background:#a3512f;border-radius:2px}
  .conn{color:#a49a8a;font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
  .hero{padding:clamp(40px,8vw,80px) 32px}
  .label{text-transform:uppercase;font-size:.62rem;font-weight:600;letter-spacing:.22em;color:#a49a8a}
  .label i{display:inline-block;width:5px;height:5px;margin-right:8px;border-radius:50%;background:#a3512f}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:clamp(3.2rem,12vw,6rem);line-height:1;letter-spacing:-.022em;font-weight:400;margin:26px 0 24px}
  h1 em{font-style:italic;color:#a3512f}
  .promise{color:#6b6156;max-width:32ch;font-size:1.1rem;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
  select,.btn{min-height:52px;border-radius:4px;font:inherit}
  select{padding:0 16px;background:#f6f1e7;color:#2c2620;border:1px solid #e0d7c6;font-weight:500}
  .btn{border:0;background:#2c2620;color:#f6f1e7;padding:0 24px;font-weight:600;display:inline-flex;align-items:center;gap:14px}
  .truth{margin-top:34px;color:#a49a8a;font-size:.74rem}
  .truth b{color:#6b6156}
  .cap{margin:28px 32px;padding-top:15px;border-top:1px solid #a49a8a;width:150px}
  .cap span{color:#6b6156;font-size:.56rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
  .cap strong{display:block;font-family:Georgia,serif;font-size:2.9rem;font-weight:400;color:#a3512f;margin:8px 0 2px}
  .cap small{color:#6b6156}
</style></head>
<body>
  <div class="bar"><span>V2 · 暖白杂志风（预览样卡）</span><a href="./">← 返回对比</a></div>
  <div class="top"><div class="mark"><i></i>ELSEWHERE, NOW</div><div class="nav"><span class="on">Encounter</span><span>Pair</span><span>Method</span></div><div class="conn">Live shell</div></div>
  <div class="hero">
    <p class="label"><i></i>A tiny atlas of ordinary life</p>
    <h1>Right now,<br><em>elsewhere</em><br>feels normal.</h1>
    <p class="promise">One ordinary moment on the other side of the world.</p>
    <div class="row"><select><option>Everyday</option></select><button class="btn">Begin →</button></div>
    <p class="truth"><b>Every person is synthetic.</b>　No tracking. No location.</p>
  </div>
  <div class="cap"><span>Reviewed scenes</span><strong>48</strong><small>6 regions</small></div>
</body></html>
